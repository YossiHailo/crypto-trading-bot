# Runs the paper-trading bot in GitHub's cloud, so it does not depend on your computer.
#
# Each run:
#   1. downloads the bot's saved state (portfolio database, reports) from the `state` branch,
#   2. runs one check every 15 minutes for about 5.5 hours (scripts/cloud_loop.sh), and after
#      every check writes the dashboard snapshot and daily report and saves everything back
#      to the `state` branch (scripts/cloud_save.sh),
#   3. starts the next run of this workflow, so the chain does not depend on GitHub's
#      scheduler (which can be late or skip runs). The schedule below is only a backup that
#      restarts the chain if it ever breaks.
# GitHub Pages serves docs/ from the `state` branch as the dashboard website.
#
# Remote control: Actions tab -> "Trading bot" -> Run workflow -> pick an action.
# Stop completely: Actions tab -> "Trading bot" -> ... -> Disable workflow.
#
# PAPER TRADING ONLY. No exchange keys are used or needed here.

name: Trading bot

on:
  schedule:
    # Backup only: restarts the chain if it broke. While a run is active, a scheduled
    # run waits in the queue (concurrency) and the newest waiting run replaces older ones.
    - cron: "4 */3 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Action (none = just run a check now)"
        type: choice
        default: none
        options: [none, pause, resume, close-all, reset-halt]
      chain:
        description: "Internal: set by the bot when it starts its own next run. Leave unticked."
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# One run at a time. A run you start by hand (Run workflow) replaces the running loop right
# away, so remote-control actions apply within a minute or two. Runs the bot chains to
# itself, and the backup schedule, wait for the running loop instead.
concurrency:
  group: trading-bot
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && !inputs.chain }}

env:
  # ---- the experiment ----
  PAPER_TRADING: "true"
  STARTING_BALANCE: "1000"
  MONTHLY_DEPOSIT: "100"     # simulated bank transfer, every month
  DEPOSIT_DAY: "1"           # on the 1st, 00:00 UTC
  # ---- market data ----
  EXCHANGE_ID: binance
  MARKET_TYPE: spot
  # Binance's public data mirror; api.binance.com refuses US cloud machines (HTTP 451).
  MARKET_DATA_URL: https://data-api.binance.vision/api/v3
  MARKET_DATA_FALLBACK: kraken
  SYMBOLS: BTC/USDT,ETH/USDT
  TIMEFRAME: 4h
  OHLCV_LIMIT: "300"
  LOOP_INTERVAL_MINUTES: "15"
  LOOP_MINUTES: "330"
  # ---- strategy and risk (same as the computer setup) ----
  STRATEGY: trend
  RISK_PER_TRADE: "0.01"
  REWARD_RISK_RATIO: "3.0"
  MIN_REWARD_RISK: "1.5"
  MIN_CONFIDENCE: "0.55"
  MAX_OPEN_POSITIONS: "3"
  MAX_NOTIONAL_PCT: "0.5"
  MAX_TOTAL_EXPOSURE_PCT: "1.0"
  DAILY_MAX_LOSS_PCT: "0.05"
  MAX_DRAWDOWN_PCT: "0.20"
  COOLDOWN_MINUTES: "60"
  USE_ATR_STOPS: "true"
  ATR_MULTIPLIER: "2.5"
  ALLOW_SHORT: "false"
  ORDER_TYPE: market
  FEE_RATE: "0.001"
  SLIPPAGE_PCT: "0.0005"
  MIN_NOTIONAL: "10"
  QUOTE_CURRENCY: USDT
  # ---- runtime ----
  DASHBOARD_ENABLED: "false"
  DATA_DIR: state/data
  LOG_DIR: state/logs
  DECISIONS_RETENTION_DAYS: "90"
  LOG_LEVEL: INFO
  REPORT_TZ: Asia/Jerusalem
  # Optional phone alerts: add these as repository secrets (Settings -> Secrets -> Actions).
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore saved state
        id: restore
        run: |
          remote="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          set +e
          git ls-remote --exit-code --heads "$remote" state > /dev/null
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            # The branch does not exist: first run ever, start a new paper account.
            mkdir -p state
            echo "No state branch yet: starting a new paper account."
          elif [ "$code" = "0" ]; then
            git clone --quiet --depth 1 --branch state "$remote" state
            rm -rf state/.git
            echo "Restored state from the state branch."
          else
            # Never start over (and overwrite the account) because of a network hiccup.
            echo "Could not reach the state branch (exit $code). Stopping without saving."
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Run checks every 15 minutes
        env:
          ACTION: ${{ inputs.action || 'none' }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/cloud_loop.sh

      - name: Start the next run
        if: ${{ !cancelled() && steps.restore.outputs.ok == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --repo "$GITHUB_REPOSITORY" --ref main -f action=none -f chain=true
