[project]
name = "crypto-trading-bot"
version = "1.1.0"
description = "Four-agent crypto trading bot with a local dashboard and a historical backtester. Paper trading is the default."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.4.0,<5",
    "pandas>=2.2.0,<4",
    "numpy>=1.26.0,<3",
    "pydantic>=2.7.0,<3",
    "pydantic-settings>=2.3.0,<3",
    "aiohttp>=3.9.0,<4",
    "python-dotenv>=1.0.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<10", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
